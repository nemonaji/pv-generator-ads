plugins {
    id 'com.android.application'
}

android {
    namespace 'com.dupfinder'
    compileSdk 35

    defaultConfig {
        applicationId "com.dupfinder.app"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        // Throw-away key kept in the repo so every build can be installed over the previous one.
        shared {
            storeFile rootProject.file('keystore/app.keystore')
            storePassword 'android'
            keyAlias 'app'
            keyPassword 'android'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.shared
        }
        debug {
            signingConfig signingConfigs.shared
        }
    }

    lint {
        checkReleaseBuilds false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}
